<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="kitBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="bodyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e36" />
      <stop offset="50%" stop-color="#16181d" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="redClamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="blackClamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="12" dy="24" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#kitBg)" />

  <!-- ==================== 4 INFLATION ADAPTER NOZZLES (TOP LEFT) ==================== -->
  <g transform="translate(40, 120)" filter="url(#shadow3D)">
    <!-- Nozzle 1: Conical plastic -->
    <g transform="translate(0, 0)">
      <rect x="5" y="0" width="16" height="22" fill="url(#brassGold)" rx="2" />
      <path d="M 0 22 L 26 22 L 20 120 L 6 120 Z" fill="#1e293b" />
    </g>
    <!-- Nozzle 2: Brass Presta adapter -->
    <g transform="translate(60, 20)">
      <rect x="0" y="0" width="22" height="42" fill="url(#brassGold)" rx="3" stroke="#854d0e" stroke-width="1.5" />
      <line x1="0" y1="12" x2="22" y2="12" stroke="#854d0e" stroke-width="2" />
      <line x1="0" y1="24" x2="22" y2="24" stroke="#854d0e" stroke-width="2" />
    </g>
    <!-- Nozzle 3: Long conical -->
    <g transform="translate(120, 0)">
      <rect x="5" y="0" width="16" height="22" fill="url(#brassGold)" rx="2" />
      <path d="M 0 22 L 26 22 L 18 120 L 8 120 Z" fill="#1e293b" />
    </g>
    <!-- Nozzle 4: Ball needle -->
    <g transform="translate(180, 0)">
      <rect x="3" y="0" width="18" height="25" fill="#94a3b8" rx="2" stroke="#475569" stroke-width="1" />
      <rect x="8" y="25" width="8" height="95" fill="#cbd5e1" rx="2" />
      <circle cx="12" cy="115" r="2" fill="#475569" />
    </g>
  </g>

  <!-- ==================== HEAVY-DUTY BRAIDED AIR HOSE (LEFT) ==================== -->
  <g transform="translate(40, 310)" filter="url(#shadow3D)">
    <!-- Metal Valve Chuck Head with thumb lock lever -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="115" height="50" rx="14" fill="#94a3b8" stroke="#475569" stroke-width="3" />
      <circle cx="28" cy="25" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
      <!-- Black lock lever -->
      <path d="M 68 25 L 135 70 L 125 125 L 85 75 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    </g>
    
    <!-- Braided black reinforced hose curve -->
    <path d="M 58 50 Q 60 480 180 500" fill="none" stroke="#181a1f" stroke-width="26" stroke-linecap="round" />
    <path d="M 58 50 Q 60 480 180 500" fill="none" stroke="#374151" stroke-width="26" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.6" />
  </g>

  <!-- ==================== MAIN 4-IN-1 DEVICE (CENTER) ==================== -->
  <g transform="translate(280, 60)" filter="url(#shadow3D)">
    
    <!-- Main Device Outer Body -->
    <rect x="0" y="0" width="410" height="850" rx="58" fill="url(#bodyDark)" stroke="#374151" stroke-width="4" />
    
    <!-- Outer Bevel Lines & Ergonomic Grips -->
    <path d="M 0 160 L 22 180 L 22 710 L 0 730" fill="none" stroke="#1f242d" stroke-width="4" />
    <path d="M 410 160 L 388 180 L 388 710 L 410 730" fill="none" stroke="#1f242d" stroke-width="4" />

    <!-- CIRCULAR DIGITAL LCD SCREEN -->
    <circle cx="205" cy="235" r="145" fill="#0b0f14" stroke="#2a303c" stroke-width="7" />
    <circle cx="205" cy="235" r="132" fill="#030a0e" stroke="#00f5ff" stroke-width="1.5" />
    
    <!-- Segmented Glowing Cyan Rings -->
    <path d="M 115 190 A 115 115 0 0 1 295 190" fill="none" stroke="#00f5ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="28 10" filter="url(#glowCyan)" />
    <path d="M 115 280 A 115 115 0 0 0 295 280" fill="none" stroke="#00f5ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="28 10" filter="url(#glowCyan)" />

    <!-- Battery icon in LCD -->
    <g transform="translate(178, 150)">
      <rect x="0" y="0" width="54" height="26" rx="4" fill="none" stroke="#00f5ff" stroke-width="3" />
      <rect x="54" y="7" width="5" height="12" rx="1" fill="#00f5ff" />
      <rect x="6" y="5" width="11" height="16" fill="#00f5ff" rx="1" />
      <rect x="21" y="5" width="11" height="16" fill="#00f5ff" rx="1" />
      <rect x="36" y="5" width="11" height="16" fill="#00f5ff" rx="1" />
    </g>

    <!-- Digital Numbers "2.50" -->
    <text x="205" y="295" font-family="'SF Pro Display', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="#00f5ff" text-anchor="middle" letter-spacing="3" filter="url(#glowCyan)">2.50</text>
    <text x="205" y="338" font-family="sans-serif" font-size="20" font-weight="800" fill="#a5f3fc" text-anchor="middle">Bar</text>

    <!-- 5-BUTTON KEYPAD -->
    <g transform="translate(140, 410)">
      <rect x="0" y="0" width="130" height="340" rx="24" fill="#111317" stroke="#262b35" stroke-width="2" />
      
      <!-- Button 1: Sun / Light -->
      <g transform="translate(18, 14)">
        <rect x="0" y="0" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
        <circle cx="47" cy="27" r="9" fill="none" stroke="#f1f5f9" stroke-width="3" />
        <line x1="47" y1="10" x2="47" y2="14" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
        <line x1="47" y1="40" x2="47" y2="44" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
        <line x1="30" y1="27" x2="34" y2="27" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
        <line x1="60" y1="27" x2="64" y2="27" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Button 2: Plus (+) -->
      <g transform="translate(18, 78)">
        <rect x="0" y="0" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
        <line x1="47" y1="16" x2="47" y2="38" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
        <line x1="36" y1="27" x2="58" y2="27" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Button 3: Power (⏻) -->
      <g transform="translate(18, 142)">
        <rect x="0" y="0" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
        <path d="M 39 21 A 13 13 0 1 0 55 21" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
        <line x1="47" y1="15" x2="47" y2="27" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Button 4: Minus (-) -->
      <g transform="translate(18, 206)">
        <rect x="0" y="0" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
        <line x1="36" y1="27" x2="58" y2="27" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Button 5: Mode (M) -->
      <g transform="translate(18, 270)">
        <rect x="0" y="0" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
        <text x="47" y="37" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="900" fill="#f1f5f9" text-anchor="middle">M</text>
      </g>
    </g>

    <!-- Bottom LED light bar -->
    <rect x="140" y="780" width="130" height="28" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- ==================== SMART JUMPER BATTERY CLAMPS (RIGHT) ==================== -->
  <!-- EC5 Blue Safety Plug Unit at bottom left of device -->
  <g transform="translate(25, 740)" filter="url(#shadow3D)">
    <rect x="0" y="0" width="170" height="90" rx="18" fill="#181a1f" stroke="#2d333f" stroke-width="3" />
    <circle cx="35" cy="45" r="16" fill="#0070f3" stroke="#0051b3" stroke-width="3" />
    <circle cx="75" cy="45" r="16" fill="#0070f3" stroke="#0051b3" stroke-width="3" />
    <circle cx="35" cy="45" r="8" fill="#e2e8f0" />
    <circle cx="75" cy="45" r="8" fill="#e2e8f0" />
  </g>

  <!-- Black Clamp (Top Right) -->
  <g transform="translate(620, 250)" filter="url(#shadow3D)">
    <!-- Black cable curve -->
    <path d="M -450 530 Q 300 700 200 280" fill="none" stroke="#111827" stroke-width="16" stroke-linecap="round" />
    
    <!-- Black Clamp Body -->
    <g transform="rotate(25, 100, 100)">
      <path d="M 0 60 L 160 0 L 260 20 L 260 80 L 160 90 L 0 60 Z" fill="url(#blackClamp)" stroke="#4b5563" stroke-width="2" />
      <path d="M 0 60 L 160 120 L 260 100 L 260 40 L 160 30 Z" fill="url(#blackClamp)" stroke="#4b5563" stroke-width="2" />
      <circle cx="140" cy="60" r="14" fill="#6b7280" stroke="#374151" stroke-width="3" />
      <!-- Teeth -->
      <polygon points="260,20 280,30 260,40 280,50 260,60" fill="#9ca3af" />
    </g>
  </g>

  <!-- Red Clamp (Middle Right) -->
  <g transform="translate(570, 520)" filter="url(#shadow3D)">
    <!-- Red cable curve -->
    <path d="M -400 260 Q 200 400 180 180" fill="none" stroke="#dc2626" stroke-width="16" stroke-linecap="round" />

    <!-- Red Clamp Body -->
    <g transform="rotate(18, 100, 100)">
      <path d="M 0 50 L 180 0 L 280 20 L 280 80 L 180 90 L 0 50 Z" fill="url(#redClamp)" stroke="#f87171" stroke-width="2" />
      <path d="M 0 50 L 180 110 L 280 90 L 280 30 L 180 20 Z" fill="url(#redClamp)" stroke="#f87171" stroke-width="2" />
      <circle cx="150" cy="50" r="14" fill="#fca5a5" stroke="#b91c1c" stroke-width="3" />
      <!-- Teeth -->
      <polygon points="280,20 300,30 280,40 300,50 280,60" fill="#cbd5e1" />
    </g>
  </g>

</svg>
