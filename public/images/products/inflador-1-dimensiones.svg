<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252a" />
      <stop offset="40%" stop-color="#121418" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2e35" />
      <stop offset="50%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041218" />
      <stop offset="100%" stop-color="#02080a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGlow)" />

  <!-- ==================== FRONT DEVICE VIEW ==================== -->
  <g transform="translate(100, 70)" filter="url(#subtleShadow)">
    
    <!-- Top Orange Port Cap Accent -->
    <rect x="180" y="5" width="60" height="12" rx="4" fill="#f97316" />
    
    <!-- Main Device Outer Shell -->
    <rect x="40" y="15" width="340" height="760" rx="48" fill="url(#bodyGrad)" stroke="#374151" stroke-width="3" />
    
    <!-- Side Grip Ridges Left & Right -->
    <path d="M 40 160 L 58 175 L 58 640 L 40 655" fill="none" stroke="#2a2e37" stroke-width="4" />
    <path d="M 380 160 L 362 175 L 362 640 L 380 655" fill="none" stroke="#2a2e37" stroke-width="4" />
    
    <!-- Outer Contour Bevel Line -->
    <rect x="62" y="38" width="296" height="714" rx="36" fill="none" stroke="#1f242d" stroke-width="2" />

    <!-- CIRCULAR DIGITAL LCD SCREEN -->
    <circle cx="210" cy="220" r="125" fill="#0b0f14" stroke="#2a303c" stroke-width="6" />
    <circle cx="210" cy="220" r="115" fill="url(#screenGlass)" stroke="#111827" stroke-width="2" />
    
    <!-- Segmented Neon Cyan Ring Arc -->
    <!-- Top Ring -->
    <path d="M 130 180 A 100 100 0 0 1 290 180" fill="none" stroke="#00f5ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="24 10" filter="url(#cyanGlow)" />
    <!-- Bottom Ring -->
    <path d="M 130 260 A 100 100 0 0 0 290 260" fill="none" stroke="#00f5ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="24 10" filter="url(#cyanGlow)" />
    
    <!-- Battery Status Icon in Screen -->
    <g transform="translate(186, 150)">
      <rect x="0" y="0" width="48" height="24" rx="4" fill="none" stroke="#00f5ff" stroke-width="2.5" />
      <rect x="48" y="6" width="4" height="12" rx="1" fill="#00f5ff" />
      <rect x="5" y="4" width="10" height="16" fill="#00f5ff" rx="1.5" />
      <rect x="19" y="4" width="10" height="16" fill="#00f5ff" rx="1.5" />
      <rect x="33" y="4" width="10" height="16" fill="#00f5ff" rx="1.5" />
    </g>

    <!-- Car Mode Icon in Screen -->
    <g transform="translate(268, 175)">
      <path d="M 2 12 L 8 4 L 24 4 L 30 12 L 32 18 L 0 18 Z" fill="#00f5ff" />
      <circle cx="7" cy="18" r="4" fill="#02080a" stroke="#00f5ff" stroke-width="2" />
      <circle cx="25" cy="18" r="4" fill="#02080a" stroke="#00f5ff" stroke-width="2" />
    </g>

    <!-- Digital Numbers "2.50" -->
    <text x="210" y="275" font-family="'SF Pro Display', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#00f5ff" text-anchor="middle" letter-spacing="2" filter="url(#cyanGlow)">2.50</text>
    <text x="210" y="308" font-family="sans-serif" font-size="16" font-weight="700" fill="#a5f3fc" text-anchor="middle">Bar</text>

    <!-- BUTTON KEYPAD -->
    <g transform="translate(155, 370)">
      <!-- Keypad Enclosure Area -->
      <rect x="0" y="0" width="110" height="290" rx="20" fill="#13161c" stroke="#252a34" stroke-width="2" />
      
      <!-- Button 1: Light / Sun -->
      <g transform="translate(15, 12)">
        <rect x="0" y="0" width="80" height="46" rx="12" fill="#1a1e26" stroke="#2f3542" stroke-width="1.5" />
        <!-- Sun icon -->
        <circle cx="40" cy="23" r="8" fill="none" stroke="#94a3b8" stroke-width="2.5" />
        <line x1="40" y1="8" x2="40" y2="12" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
        <line x1="40" y1="34" x2="40" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
        <line x1="25" y1="23" x2="29" y2="23" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
        <line x1="51" y1="23" x2="55" y2="23" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Button 2: Plus (+) -->
      <g transform="translate(15, 68)">
        <rect x="0" y="0" width="80" height="46" rx="12" fill="#1a1e26" stroke="#2f3542" stroke-width="1.5" />
        <line x1="40" y1="13" x2="40" y2="33" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <line x1="30" y1="23" x2="50" y2="23" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Button 3: Power (⏻) -->
      <g transform="translate(15, 124)">
        <rect x="0" y="0" width="80" height="46" rx="12" fill="#1a1e26" stroke="#2f3542" stroke-width="1.5" />
        <!-- Power icon -->
        <path d="M 33 18 A 11 11 0 1 0 47 18" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
        <line x1="40" y1="13" x2="40" y2="23" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Button 4: Minus (-) -->
      <g transform="translate(15, 180)">
        <rect x="0" y="0" width="80" height="46" rx="12" fill="#1a1e26" stroke="#2f3542" stroke-width="1.5" />
        <line x1="30" y1="23" x2="50" y2="23" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Button 5: Mode (↺ / M) -->
      <g transform="translate(15, 236)">
        <rect x="0" y="0" width="80" height="46" rx="12" fill="#1a1e26" stroke="#2f3542" stroke-width="1.5" />
        <path d="M 32 28 A 10 10 0 1 1 48 23" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
        <polyline points="48,17 48,24 41,24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Bottom LED Spotlight Diffuser -->
    <rect x="155" y="685" width="110" height="28" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- ==================== SIDE DEVICE VIEW ==================== -->
  <g transform="translate(680, 70)" filter="url(#subtleShadow)">
    <!-- Side Outer Body -->
    <rect x="0" y="15" width="210" height="760" rx="28" fill="url(#sideGrad)" stroke="#374151" stroke-width="3" />
    <!-- Center Grip Indentation -->
    <rect x="25" y="240" width="160" height="420" rx="16" fill="#111317" stroke="#1f232b" stroke-width="2" />
    <path d="M 0 240 L 25 255 L 25 645 L 0 660" fill="#1b1e24" />
    <path d="M 210 240 L 185 255 L 185 645 L 210 660" fill="#1b1e24" />
  </g>

  <!-- ==================== DIMENSIONS ANNOTATIONS ==================== -->
  
  <!-- Height Dimension (193mm / 7.6 inch) -->
  <g transform="translate(500, 70)">
    <!-- Top Extension Line -->
    <line x1="-30" y1="15" x2="30" y2="15" stroke="#475569" stroke-width="3" />
    <!-- Bottom Extension Line -->
    <line x1="-30" y1="775" x2="30" y2="775" stroke="#475569" stroke-width="3" />
    <!-- Vertical Dimension Line with Arrowheads -->
    <line x1="0" y1="15" x2="0" y2="775" stroke="#475569" stroke-width="3" />
    
    <!-- Dimension Text -->
    <rect x="15" y="340" width="160" height="90" rx="12" fill="#ffffff" fill-opacity="0.9" />
    <text x="25" y="380" font-family="'SF Pro Display', sans-serif" font-size="34" font-weight="900" fill="#0f172a">7.6(inch)</text>
    <text x="25" y="420" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="800" fill="#334155">193(mm)</text>
  </g>

  <!-- Width Dimension (85mm / 3.35 inch) -->
  <g transform="translate(100, 860)">
    <!-- Left Extension Line -->
    <line x1="40" y1="-20" x2="40" y2="20" stroke="#475569" stroke-width="3" />
    <!-- Right Extension Line -->
    <line x1="380" y1="-20" x2="380" y2="20" stroke="#475569" stroke-width="3" />
    <!-- Horizontal Dimension Line -->
    <line x1="40" y1="0" x2="380" y2="0" stroke="#475569" stroke-width="3" />
    
    <text x="210" y="45" font-family="'SF Pro Display', sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle">3.35(inch)</text>
    <text x="210" y="85" font-family="'SF Pro Display', sans-serif" font-size="30" font-weight="800" fill="#334155" text-anchor="middle">85(mm)</text>
  </g>

  <!-- Depth Dimension (60mm / 2.36 inch) -->
  <g transform="translate(680, 860)">
    <!-- Left Extension Line -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#475569" stroke-width="3" />
    <!-- Right Extension Line -->
    <line x1="210" y1="-20" x2="210" y2="20" stroke="#475569" stroke-width="3" />
    <!-- Horizontal Dimension Line -->
    <line x1="0" y1="0" x2="210" y2="0" stroke="#475569" stroke-width="3" />
    
    <text x="105" y="45" font-family="'SF Pro Display', sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle">2.36(inch)</text>
    <text x="105" y="85" font-family="'SF Pro Display', sans-serif" font-size="30" font-weight="800" fill="#334155" text-anchor="middle">60(mm)</text>
  </g>

</svg>
