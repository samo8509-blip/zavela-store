<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="dualBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf2f7" />
    </radialGradient>
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3038" />
      <stop offset="50%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dualShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="10" dy="20" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#dualBg)" />

  <!-- ==================== LEFT UNIT: CLOSE-UP PERSPECTIVE ==================== -->
  <g transform="translate(80, 40)" filter="url(#dualShadow)">
    <rect x="0" y="0" width="410" height="880" rx="60" fill="url(#matteBlack)" stroke="#374151" stroke-width="4" />
    
    <!-- Screen -->
    <circle cx="205" cy="240" r="145" fill="#0b0f14" stroke="#282e3a" stroke-width="8" />
    <circle cx="205" cy="240" r="130" fill="#03090d" stroke="#00f5ff" stroke-width="1.5" />
    
    <!-- Glowing Ring -->
    <path d="M 115 195 A 115 115 0 0 1 295 195" fill="none" stroke="#00f5ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="28 10" filter="url(#softGlow)" />
    <path d="M 115 285 A 115 115 0 0 0 295 285" fill="none" stroke="#00f5ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="28 10" filter="url(#softGlow)" />
    
    <!-- Battery Status Icon -->
    <g transform="translate(178, 155)">
      <rect x="0" y="0" width="54" height="26" rx="4" fill="none" stroke="#00f5ff" stroke-width="3" />
      <rect x="54" y="7" width="5" height="12" rx="1" fill="#00f5ff" />
      <rect x="6" y="5" width="11" height="16" fill="#00f5ff" rx="1" />
      <rect x="21" y="5" width="11" height="16" fill="#00f5ff" rx="1" />
      <rect x="36" y="5" width="11" height="16" fill="#00f5ff" rx="1" />
    </g>

    <text x="205" y="300" font-family="'SF Pro Display', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="#00f5ff" text-anchor="middle" filter="url(#softGlow)">2.50</text>
    <text x="205" y="342" font-family="sans-serif" font-size="20" font-weight="800" fill="#a5f3fc" text-anchor="middle">Bar</text>

    <!-- Keypad -->
    <g transform="translate(140, 420)">
      <rect x="0" y="0" width="130" height="340" rx="24" fill="#111317" stroke="#242932" stroke-width="2" />
      
      <!-- Light -->
      <rect x="18" y="14" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
      <circle cx="65" cy="41" r="9" fill="none" stroke="#f1f5f9" stroke-width="3" />
      <line x1="65" y1="24" x2="65" y2="28" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
      <line x1="65" y1="54" x2="65" y2="58" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />

      <!-- Plus -->
      <rect x="18" y="78" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
      <line x1="65" y1="94" x2="65" y2="116" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
      <line x1="54" y1="105" x2="76" y2="105" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />

      <!-- Power -->
      <rect x="18" y="142" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
      <path d="M 57 163 A 13 13 0 1 0 73 163" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
      <line x1="65" y1="157" x2="65" y2="169" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />

      <!-- Minus -->
      <rect x="18" y="206" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
      <line x1="54" y1="233" x2="76" y2="233" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />

      <!-- M -->
      <rect x="18" y="270" width="94" height="54" rx="14" fill="#1b1e25" stroke="#333a48" stroke-width="2" />
      <text x="65" y="307" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="900" fill="#f1f5f9" text-anchor="middle">M</text>
    </g>
  </g>

  <!-- ==================== RIGHT UNIT: CONNECTED WITH CABLES ==================== -->
  <g transform="translate(620, 440)" filter="url(#dualShadow)">
    
    <!-- Top Braided Hose Connected vertically -->
    <g transform="translate(85, -400)">
      <!-- Quick lock head at top -->
      <rect x="0" y="0" width="80" height="34" rx="10" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <circle cx="20" cy="17" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
      <!-- Braided vertical hose -->
      <line x1="55" y1="34" x2="55" y2="400" stroke="#1e293b" stroke-width="20" stroke-linecap="round" />
      <line x1="55" y1="34" x2="55" y2="400" stroke="#475569" stroke-width="20" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.6" />
    </g>

    <!-- Top Jump Starter Cables & Clamps Unit connected at top right -->
    <g transform="translate(195, -340)">
      <rect x="0" y="240" width="40" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <!-- Red & Black curved cables -->
      <path d="M 15 240 Q -40 80 40 40" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
      <path d="M 25 240 Q 60 120 70 80" fill="none" stroke="#1f2937" stroke-width="8" stroke-linecap="round" />
      
      <!-- Mini Red Clamp -->
      <g transform="translate(30, 20) rotate(15)">
        <polygon points="0,15 35,0 55,5 55,25 35,30" fill="#dc2626" />
      </g>
      <!-- Mini Black Clamp -->
      <g transform="translate(60, 60) rotate(25)">
        <polygon points="0,15 35,0 55,5 55,25 35,30" fill="#1f2937" />
      </g>
    </g>

    <!-- Right Unit Body (Scaled) -->
    <rect x="0" y="0" width="250" height="520" rx="36" fill="url(#matteBlack)" stroke="#374151" stroke-width="3" />
    
    <!-- Screen -->
    <circle cx="125" cy="140" r="88" fill="#0b0f14" stroke="#282e3a" stroke-width="5" />
    <circle cx="125" cy="140" r="78" fill="#03090d" stroke="#00f5ff" stroke-width="1" />
    <path d="M 70 115 A 70 70 0 0 1 180 115" fill="none" stroke="#00f5ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 6" filter="url(#softGlow)" />
    <path d="M 70 165 A 70 70 0 0 0 180 165" fill="none" stroke="#00f5ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 6" filter="url(#softGlow)" />
    <text x="125" y="175" font-family="'SF Pro Display', sans-serif" font-size="46" font-weight="900" fill="#00f5ff" text-anchor="middle" filter="url(#softGlow)">2.50</text>
    <text x="125" y="200" font-family="sans-serif" font-size="12" font-weight="800" fill="#a5f3fc" text-anchor="middle">Bar</text>

    <!-- Keypad mini -->
    <g transform="translate(85, 245)">
      <rect x="0" y="0" width="80" height="210" rx="16" fill="#111317" stroke="#242932" stroke-width="1.5" />
      <rect x="10" y="8" width="60" height="34" rx="8" fill="#1b1e25" stroke="#333a48" />
      <rect x="10" y="48" width="60" height="34" rx="8" fill="#1b1e25" stroke="#333a48" />
      <rect x="10" y="88" width="60" height="34" rx="8" fill="#1b1e25" stroke="#333a48" />
      <rect x="10" y="128" width="60" height="34" rx="8" fill="#1b1e25" stroke="#333a48" />
      <rect x="10" y="168" width="60" height="34" rx="8" fill="#1b1e25" stroke="#333a48" />
      <text x="40" y="193" font-family="'SF Pro Display', sans-serif" font-size="18" font-weight="900" fill="#f1f5f9" text-anchor="middle">M</text>
    </g>
  </g>

  <!-- ==================== 4 NOZZLES IN FRONT (BOTTOM) ==================== -->
  <g transform="translate(540, 805)" filter="url(#dualShadow)">
    <!-- Conical 1 -->
    <rect x="0" y="0" width="24" height="150" fill="#1e293b" rx="6" />
    <!-- Conical 2 -->
    <rect x="45" y="60" width="30" height="90" fill="#334155" rx="6" />
    <!-- Ball needle -->
    <rect x="95" y="25" width="20" height="125" fill="#cbd5e1" rx="4" />
    <!-- Brass adapter -->
    <rect x="135" y="105" width="30" height="45" fill="url(#goldBrass)" rx="4" stroke="#854d0e" stroke-width="1.5" />
  </g>

</svg>
