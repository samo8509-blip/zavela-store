<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2f6" />
    </radialGradient>
    <linearGradient id="caseDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d323b" />
      <stop offset="50%" stop-color="#191c22" />
      <stop offset="100%" stop-color="#0b0d10" />
    </linearGradient>
    <linearGradient id="dewaltYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd500" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="steelChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Main Hard Case Container -->
  <g transform="translate(100, 40)" filter="url(#shadowHeavy)">
    <!-- Molded Case Outer Body -->
    <rect x="0" y="0" width="800" height="900" rx="36" fill="url(#caseDark)" stroke="#475569" stroke-width="4" />
    <rect x="20" y="20" width="760" height="860" rx="28" fill="#12151a" stroke="#222834" stroke-width="3" />
    
    <!-- Central Divider / Hinge -->
    <rect x="20" y="440" width="760" height="20" fill="#0b0d10" stroke="#2e384d" stroke-width="2" />
    <!-- Handle -->
    <path d="M 330 0 L 330 -35 Q 330 -50 350 -50 L 450 -50 Q 470 -50 470 -35 L 470 0 Z" fill="#1e232d" stroke="#475569" stroke-width="3" />
    <rect x="360" y="-35" width="80" height="20" rx="10" fill="#0b0d10" />

    <!-- ================= UPPER HALF: ACCESSORIES & HAND TOOLS ================= -->
    <g transform="translate(40, 40)">
      <!-- Hacksaw (Left) -->
      <path d="M 20 20 L 20 280 Q 20 320 60 320 L 90 320 L 90 350 L 20 350 Q 0 350 0 320 L 0 20 Q 0 0 20 0 L 130 0 L 130 30 L 20 30 Z" fill="url(#dewaltYellow)" />
      <line x1="20" y1="20" x2="130" y2="20" stroke="url(#steelChrome)" stroke-width="6" />
      <rect x="30" y="40" width="20" height="140" rx="4" fill="url(#dewaltYellow)" />
      <!-- Sockets on yellow strip -->
      <g transform="translate(35, 50)">
        <circle cx="5" cy="15" r="7" fill="url(#steelChrome)" stroke="#334155" />
        <circle cx="5" cy="35" r="7" fill="url(#steelChrome)" stroke="#334155" />
        <circle cx="5" cy="55" r="8" fill="url(#steelChrome)" stroke="#334155" />
        <circle cx="5" cy="75" r="8" fill="url(#steelChrome)" stroke="#334155" />
        <circle cx="5" cy="95" r="9" fill="url(#steelChrome)" stroke="#334155" />
        <circle cx="5" cy="115" r="9" fill="url(#steelChrome)" stroke="#334155" />
      </g>

      <!-- Tape Measure & PVC Tape -->
      <g transform="translate(30, 270)">
        <circle cx="35" cy="35" r="30" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
        <circle cx="35" cy="35" r="18" fill="#1e293b" />
        <text x="35" y="39" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">5m</text>
      </g>

      <!-- Screwdrivers (Center Left) -->
      <g transform="translate(180, 20)">
        <!-- Screwdriver 1 -->
        <rect x="0" y="0" width="30" height="85" rx="8" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="4" />
        <rect x="12" y="85" width="6" height="130" fill="url(#steelChrome)" />
        <!-- Screwdriver 2 -->
        <rect x="45" y="0" width="30" height="85" rx="8" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="4" />
        <rect x="57" y="85" width="6" height="140" fill="url(#steelChrome)" />
        <!-- Bit Driver -->
        <rect x="22" y="140" width="36" height="100" rx="10" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="5" />
        <rect x="36" y="240" width="8" height="60" fill="url(#steelChrome)" />
      </g>

      <!-- Utility Knife / Cutter -->
      <g transform="translate(160, 310)">
        <path d="M 0 10 L 160 10 L 180 25 L 160 40 L 0 40 Z" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="5" />
        <rect x="20" y="16" width="120" height="18" fill="url(#dewaltYellow)" rx="3" />
        <rect x="70" y="20" width="20" height="10" fill="#cbd5e1" rx="2" />
      </g>

      <!-- Hardware Box (Center: Screws & Wall Plugs) -->
      <g transform="translate(290, 80)">
        <rect x="0" y="0" width="95" height="130" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b" stroke-width="2" />
        <line x1="47" y1="0" x2="47" y2="130" stroke="#64748b" />
        <line x1="0" y1="65" x2="95" y2="65" stroke="#64748b" />
        <!-- Yellow Plugs -->
        <rect x="10" y="15" width="6" height="35" fill="#facc15" rx="2" />
        <rect x="22" y="15" width="6" height="35" fill="#facc15" rx="2" />
        <rect x="34" y="15" width="6" height="35" fill="#facc15" rx="2" />
        <!-- Blue Plugs -->
        <rect x="58" y="15" width="6" height="35" fill="#38bdf8" rx="2" />
        <rect x="70" y="15" width="6" height="35" fill="#38bdf8" rx="2" />
        <!-- Screws -->
        <rect x="10" y="80" width="4" height="35" fill="#cbd5e1" />
        <rect x="25" y="80" width="4" height="35" fill="#cbd5e1" />
        <!-- Red Plugs -->
        <rect x="58" y="80" width="6" height="35" fill="#ef4444" rx="2" />
        <rect x="70" y="80" width="6" height="35" fill="#ef4444" rx="2" />
      </g>

      <!-- Digital Voltage Tester & Precision Screwdrivers (Right) -->
      <g transform="translate(410, 40)">
        <!-- Digital Tester Pen -->
        <rect x="0" y="40" width="22" height="150" rx="4" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="2" />
        <rect x="5" y="70" width="12" height="20" fill="#1e293b" />
        <rect x="9" y="190" width="4" height="30" fill="url(#steelChrome)" />

        <!-- 4 Precision Screwdrivers -->
        <g transform="translate(40, 20)">
          <rect x="0" y="30" width="14" height="70" rx="3" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="2" />
          <rect x="5" y="100" width="4" height="60" fill="url(#steelChrome)" />

          <rect x="22" y="30" width="14" height="70" rx="3" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="2" />
          <rect x="27" y="100" width="4" height="60" fill="url(#steelChrome)" />

          <rect x="44" y="30" width="14" height="70" rx="3" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="2" />
          <rect x="49" y="100" width="4" height="60" fill="url(#steelChrome)" />

          <rect x="66" y="30" width="14" height="70" rx="3" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="2" />
          <rect x="71" y="100" width="4" height="60" fill="url(#steelChrome)" />
        </g>
      </g>

      <!-- Spade Bits & Twist Drill Bits (Top Right) -->
      <g transform="translate(540, 10)">
        <!-- Spade Bits -->
        <path d="M 10 30 L 25 30 L 17 0 Z" fill="url(#steelChrome)" />
        <rect x="15" y="30" width="5" height="100" fill="url(#steelChrome)" />
        <path d="M 40 30 L 58 30 L 49 0 Z" fill="url(#steelChrome)" />
        <rect x="46" y="30" width="5" height="100" fill="url(#steelChrome)" />
        <!-- Drill Bits Set -->
        <rect x="75" y="10" width="5" height="110" fill="url(#steelChrome)" />
        <rect x="90" y="20" width="5" height="100" fill="url(#steelChrome)" />
        <rect x="105" y="30" width="5" height="90" fill="url(#steelChrome)" />
        <rect x="120" y="40" width="5" height="80" fill="url(#steelChrome)" />
        <!-- Screwdriver Bit Set holder -->
        <rect x="10" y="150" width="150" height="30" rx="4" fill="#0f172a" stroke="#475569" />
        <g fill="url(#steelChrome)" transform="translate(20, 140)">
          <rect x="0" y="0" width="6" height="15" />
          <rect x="15" y="0" width="6" height="15" />
          <rect x="30" y="0" width="6" height="15" />
          <rect x="45" y="0" width="6" height="15" />
          <rect x="60" y="0" width="6" height="15" />
          <rect x="75" y="0" width="6" height="15" />
          <rect x="90" y="0" width="6" height="15" />
          <rect x="105" y="0" width="6" height="15" />
          <rect x="120" y="0" width="6" height="15" />
        </g>
      </g>
    </g>

    <!-- ================= LOWER HALF: DEWALT DRILL, BATTERIES, HAMMER, PLIERS ================= -->
    <g transform="translate(40, 480)">
      <!-- Combination Pliers (Left Top) -->
      <g transform="translate(10, 20)">
        <path d="M 15 0 L 25 0 L 25 50 L 15 50 Z" fill="url(#steelChrome)" />
        <path d="M 0 50 Q 0 140 10 160 L 20 160 Q 15 140 15 50 Z" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
        <path d="M 40 50 Q 40 140 30 160 L 20 160 Q 25 140 25 50 Z" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
      </g>

      <!-- Long Nose Pliers (Left Bottom) -->
      <g transform="translate(10, 190)">
        <path d="M 17 0 L 23 0 L 25 60 L 15 60 Z" fill="url(#steelChrome)" />
        <path d="M 0 60 Q 0 140 10 160 L 20 160 Q 15 140 15 60 Z" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
        <path d="M 40 60 Q 40 140 30 160 L 20 160 Q 25 140 25 60 Z" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
      </g>

      <!-- Adjustable Wrench (Llave Expansiva) -->
      <g transform="translate(80, 110)">
        <path d="M 20 0 L 55 0 L 45 45 L 30 45 L 20 0 Z" fill="url(#steelChrome)" stroke="#334155" stroke-width="2" />
        <rect x="25" y="45" width="20" height="150" rx="6" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
        <circle cx="35" cy="180" r="4" fill="#0f172a" />
      </g>

      <!-- Claw Hammer (Martillo) -->
      <g transform="translate(160, 20)">
        <path d="M 0 25 Q 20 0 70 0 L 70 35 L 0 35 Z" fill="url(#steelChrome)" stroke="#334155" stroke-width="2" />
        <rect x="35" y="35" width="22" height="270" rx="6" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="4" />
        <rect x="37" y="140" width="18" height="140" fill="url(#dewaltYellow)" rx="4" />
      </g>

      <!-- DeWalt Charger Dock (Center) -->
      <g transform="translate(240, 110)">
        <rect x="0" y="0" width="150" height="180" rx="16" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="5" />
        <rect x="25" y="30" width="100" height="70" rx="8" fill="#1e293b" />
        <rect x="50" y="45" width="10" height="25" fill="#f8fafc" />
        <rect x="70" y="45" width="10" height="25" fill="#f8fafc" />
        <rect x="90" y="45" width="10" height="25" fill="#f8fafc" />
        <rect x="30" y="125" width="90" height="35" fill="#0f172a" rx="4" />
        <text x="75" y="147" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffd500" text-anchor="middle" letter-spacing="1">DEWALT</text>
      </g>

      <!-- DEWALT CORDLESS DRILL (Right Main Tool) -->
      <g transform="translate(420, 10)">
        <!-- Chuck & Torque Collar -->
        <rect x="0" y="15" width="60" height="60" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
        <line x1="20" y1="15" x2="20" y2="75" stroke="#64748b" stroke-width="2" />
        <line x1="40" y1="15" x2="40" y2="75" stroke="#64748b" stroke-width="2" />
        
        <!-- Drill Body Housing (Yellow & Black DeWalt signature) -->
        <path d="M 55 5 L 230 5 Q 260 5 260 40 L 260 70 Q 260 90 230 90 L 150 90 L 175 220 L 130 220 L 95 90 L 55 90 Z" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="5" />
        
        <!-- Black Rubberized Grip Inserts -->
        <path d="M 120 95 L 155 95 L 140 215 L 110 215 Z" fill="#0f172a" />
        <rect x="80" y="25" width="140" height="45" rx="6" fill="#0f172a" />
        <text x="150" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffd500" text-anchor="middle" letter-spacing="2">DEWALT</text>
        
        <!-- Trigger Switch -->
        <path d="M 95 110 Q 80 120 95 135 L 110 130 Z" fill="#ef4444" stroke="#0f172a" stroke-width="2" />
        <circle cx="125" cy="85" r="6" fill="#ffffff" />
      </g>

      <!-- 2x DEWALT 48V/XR LITHIUM BATTERIES (Bottom Right) -->
      <g transform="translate(440, 230)">
        <!-- Battery 1 -->
        <rect x="0" y="0" width="190" height="60" rx="10" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
        <rect x="25" y="10" width="140" height="40" rx="6" fill="#0f172a" />
        <text x="95" y="35" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">48V / XR <tspan fill="#ffd500">DEWALT</tspan></text>
        
        <!-- Battery 2 -->
        <rect x="0" y="68" width="190" height="60" rx="10" fill="url(#dewaltYellow)" stroke="#0f172a" stroke-width="4" />
        <rect x="25" y="78" width="140" height="40" rx="6" fill="#0f172a" />
        <text x="95" y="103" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">48V / XR <tspan fill="#ffd500">DEWALT</tspan></text>
      </g>
    </g>
  </g>

  <!-- Top Floating Trust Badges -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#0f172a" stroke="url(#goldBadge)" stroke-width="2" />
    <text x="110" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#facc15" text-anchor="middle" letter-spacing="1">KIT PROFESIONAL 24+ EN 1</text>
  </g>
  
  <g transform="translate(720, 50)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="110" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1">2 BATERÍAS LITIO + MALETÍN</text>
  </g>
</svg>
